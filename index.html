<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>miriam / alyona :)</title>
  <meta name="description" content="miriam & alyona — links to YouTube, TikTok, and my Discord." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d0d0f;
      --fg: #f0eee8;
      --muted: #888;
      --accent: #c9b8ff;
      --accent2: #ffb8d9;
      --radius: 18px;
      --dur: 0.35s;
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      cursor: none;
    }

    a,
    button,
    [role="button"] {
      cursor: none;
    }

    #cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      mix-blend-mode: difference;
      background: #fff;
      transition:
        width var(--dur) cubic-bezier(.22, 1, .36, 1),
        height var(--dur) cubic-bezier(.22, 1, .36, 1),
        opacity .2s;
      will-change: transform;
    }

    #cursor.grow {
      width: 52px;
      height: 52px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 20% 30%, #2a1a4a55 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 80% 70%, #1a2a4a55 0%, transparent 70%);
      pointer-events: none;
    }

    .page {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.8rem;
      padding: 2rem;
    }

    .title {
      text-align: center;
      line-height: 1.1;
    }

    .title h1 {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--fg) 40%, var(--accent) 75%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--muted), transparent);
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      width: 100%;
      max-width: 340px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.4rem;
      border-radius: var(--radius);
      text-decoration: none;
      color: var(--fg);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition:
        background var(--dur) ease,
        border-color var(--dur) ease,
        transform var(--dur) cubic-bezier(.22, 1, .36, 1),
        box-shadow var(--dur) ease;
      position: relative;
      overflow: hidden;
    }

    .link-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--card-a) 0%, var(--card-b) 100%);
      opacity: 0;
      transition: opacity var(--dur) ease;
      border-radius: inherit;
    }

    .link-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px) scale(1.015);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    }

    .link-card:hover::before {
      opacity: 0.06;
    }

    .link-card:active {
      transform: translateY(0) scale(0.99);
    }

    .link-card[data-platform="youtube"] {
      --card-a: #ff0000;
      --card-b: #ff6b35;
    }

    .link-card[data-platform="tiktok"] {
      --card-a: #00f2ea;
      --card-b: #ff0050;
    }

    .link-card[data-platform="discord"] {
      --card-a: #5865f2;
      --card-b: #7289da;
    }

    .link-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    .link-icon svg {
      width: 20px;
      height: 20px;
    }

    .link-text {
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    .link-name {
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .link-handle {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 1px;
    }

    .link-arrow {
      margin-left: auto;
      color: var(--muted);
      position: relative;
      z-index: 1;
      transition: transform var(--dur) ease, color var(--dur) ease;
    }

    .link-card:hover .link-arrow {
      transform: translateX(3px);
      color: var(--fg);
    }

    .footer {
      font-size: 0.7rem;
      color: #444;
      letter-spacing: 0.12em;
    }

    @keyframes grain {

      0%,
      100% {
        transform: translate(0, 0);
      }

      10% {
        transform: translate(-2%, -3%);
      }

      20% {
        transform: translate(3%, 2%);
      }

      30% {
        transform: translate(-1%, 4%);
      }

      40% {
        transform: translate(2%, -1%);
      }

      50% {
        transform: translate(-3%, 1%);
      }

      60% {
        transform: translate(1%, 3%);
      }

      70% {
        transform: translate(-2%, -2%);
      }

      80% {
        transform: translate(3%, -3%);
      }

      90% {
        transform: translate(-1%, 2%);
      }
    }

    body::after {
      content: '';
      position: fixed;
      inset: -50%;
      width: 200%;
      height: 200%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.028;
      pointer-events: none;
      animation: grain 0.5s steps(1) infinite;
    }
  </style>
</head>

<body>

  <div id="cursor"></div>

  <main class="page">

    <div class="title">
      <h1>miriam / alyona&nbsp;:)</h1>
    </div>

    <div class="divider"></div>

    <nav class="links" aria-label="Social links">

      <a id="link-youtube" class="link-card" href="https://youtube.com/@alyonaux" target="_blank"
        rel="noopener noreferrer" data-platform="youtube">
        <span class="link-icon">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">

        <span class="link-arrow" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.5 7h9M8 3.5l3.5 3.5L8 10.5" />
          </svg>
        </span>
      </a>

      <a id="link-tiktok" class="link-card" href="https://tiktok.com/@miriam.m4a" target="_blank"
        rel="noopener noreferrer" data-platform="tiktok">
        <span class="link-icon">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.74a4.85 4.85 0 0 1-1.01-.05z" />
          </svg>
        </span>
        <span class="link-text">
          <span class="link-name">TikTok</span>
          <span class="link-handle">main posts</span>
        </span>
        <span class="link-arrow" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.5 7h9M8 3.5l3.5 3.5L8 10.5" />
          </svg>
        </span>
      </a>

      <a id="link-discord" class="link-card" href="https://alyona.uk" target="_blank" rel="noopener noreferrer"
        data-platform="discord">
        <span class="link-icon">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M20.32 4.37A19.79 19.79 0 0 0 15.52 3a13.72 13.72 0 0 0-.62 1.26 18.27 18.27 0 0 0-5.8 0A12.92 12.92 0 0 0 8.47 3a19.68 19.68 0 0 0-4.81 1.38C.54 8.84-.33 13.18.1 17.45a19.9 19.9 0 0 0 6.07 3.07 14.94 14.94 0 0 0 1.3-2.1 12.93 12.93 0 0 1-2.05-.98l.5-.38a14.24 14.24 0 0 0 12.17 0l.5.38a13.1 13.1 0 0 1-2.06.99 14.73 14.73 0 0 0 1.3 2.09 19.8 19.8 0 0 0 6.07-3.07c.5-5-.85-9.3-3.58-13.08zM8.02 14.85c-1.25 0-2.28-1.14-2.28-2.55s1-2.56 2.28-2.56 2.3 1.15 2.28 2.56c.02 1.41-.99 2.55-2.28 2.55zm7.96 0c-1.25 0-2.27-1.14-2.27-2.55s1-2.56 2.27-2.56 2.3 1.15 2.28 2.56c0 1.41-1 2.55-2.28 2.55z" />
          </svg>
        </span>
        <span class="link-text">
          <span class="link-name">Discord</span>
          <span class="link-handle">coming soon!</span>
        </span>
        <span class="link-arrow" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.5 7h9M8 3.5l3.5 3.5L8 10.5" />

        </span>
      </a>
    </nav>

    <p class="footer">last updated 17/08/26</p>
  </main>

  <script>
    const cursor = document.getElementById('cursor');
    let mouseX = -100, mouseY = -100;
    let curX = -100, curY = -100;

    function lerp(a, b, t) { return a + (b - a) * t; }

    function tick() {
      curX = lerp(curX, mouseX, 0.18);
      curY = lerp(curY, mouseY, 0.18);
      cursor.style.transform = 'translate(calc(' + curX + 'px - 50%), calc(' + curY + 'px - 50%))';
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    document.addEventListener('mousemove', function (e) {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    document.querySelectorAll('a, button, [role="button"]').forEach(function (el) {
      el.addEventListener('mouseenter', function () { cursor.classList.add('grow'); });
      el.addEventListener('mouseleave', function () { cursor.classList.remove('grow'); });
    });

    document.addEventListener('mouseleave', function () { cursor.style.opacity = '0'; });
    document.addEventListener('mouseenter', function () { cursor.style.opacity = '1'; });
  </script>
</body>

</html>
